<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f7f2"><title>Daner Dos — Animated Card</title><style>
:root{--background:#f7f7f2;--surface:#fff;--text:#181a16;--muted:#676b61;--line:rgba(24,26,22,.13);--line-strong:rgba(24,26,22,.24);--accent:#1b75bb;--accent-fill:#1b75bb}*{box-sizing:border-box}body{margin:0;background:#e9eceb;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px}.toolbar{width:min(100%,960px);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;background:#1b75bb;color:white;font-weight:800;font-size:20px}.brand strong,.brand small{display:block}.brand small{font-size:12px;color:#68716d}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #cad2d2;background:white;padding:10px 13px;font:600 13px inherit;cursor:pointer;border-radius:6px}.actions button:hover{background:#e9f1fb}.stage{width:min(100%,960px);flex:1;min-height:560px;background:var(--background);overflow:hidden;display:grid;place-items:center;position:relative;box-shadow:0 16px 45px #17232a12}.scene{width:100%;height:100%;min-height:560px;display:grid;place-items:center;overflow:hidden}.hero-visual{width:100%}.hint{color:#68716d;text-align:center;font-size:12px;margin-bottom:6px}
.hero-visual {
  position: relative;
  min-height: 520px;
  display: grid;
  place-items: center;
}

.orbit {
  position: absolute;
  border: 1px solid var(--line);
  border-radius: 50%;
  z-index: 1;
  pointer-events: none;
}

.orbit-one {
  width: min(92vw, 510px);
  height: min(92vw, 510px);
  animation: rotate 24s linear infinite;
}

.orbit-two {
  width: 390px;
  height: 390px;
  animation: rotate 16s linear infinite reverse;
}

.orbit::before,
.orbit::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-fill);
  box-shadow: 0 0 24px rgba(27, 117, 187, 0.28);
}

.orbit::before {
  top: -3.5px;
  left: 50%;
  transform: translateX(-50%);
}

.orbit::after {
  bottom: -3.5px;
  left: 50%;
  transform: translateX(-50%);
}

/* Twin fading trails travel with the two diametrically opposite dots. */
/* Two short tapered trails, one behind each dot, on the same circular path. */
.orbit-one { border-color:rgba(27,117,187,.12); }
.orbit-trails { position:absolute; inset:0; border-radius:50%;
 background:conic-gradient(from -90deg,
 rgba(27,117,187,.8) 0deg,rgba(27,117,187,.25) 17deg,transparent 43deg,
 transparent 180deg,rgba(27,117,187,.8) 180deg,rgba(27,117,187,.25) 197deg,transparent 223deg,transparent 360deg);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
 mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px)); }
.orbit-one::before,.orbit-one::after {width:9px;height:9px;box-shadow:0 0 9px 3px rgba(27,117,187,.38),0 0 20px rgba(27,117,187,.24)}
.orbit-one::before{top:-4.5px}.orbit-one::after{bottom:-4.5px}
.profile-card { animation: gentleFloat 5.5s ease-in-out infinite; }
.profile-top { animation: revealUp .85s .12s both cubic-bezier(.2,.7,.2,1); }
.profile-code { animation: revealUp .9s .35s both cubic-bezier(.2,.7,.2,1); }
.profile-metrics { animation: revealUp .9s .6s both cubic-bezier(.2,.7,.2,1); }
@keyframes gentleFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
@keyframes revealUp { from {opacity:0;transform:translateY(15px);} to {opacity:1;transform:translateY(0);} }
.profile-card {
  position: relative;
  z-index: 2;
  width: min(100%, 440px);
  padding: 16px 28px 28px;
  border: 1px solid var(--line-strong);
  background:
    linear-gradient(145deg, rgba(27, 117, 187, 0.11), transparent 60%),
    rgba(255, 255, 255, 0.96);
  box-shadow: 0 34px 90px rgba(42, 47, 31, 0.14);
  backdrop-filter: blur(18px);
}

.profile-top {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.8rem;
}

.profile-top .card-logo { width: 62px; height: 62px; object-fit: contain; margin-left: auto; flex-shrink: 0; }
.profile-top .brand-blue { color: #0F75BC; }
.profile-top .status-dot { flex-shrink: 0; }
.profile-top > span:not(.status-dot) { font-size: 1.25rem; font-weight: 400; color: var(--text); letter-spacing: -0.025em; }
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 16px rgba(27, 117, 187, 0.3);
}

.profile-code {
  display: flex;
  flex-direction: column;
  padding: 145px 0;
  font-family: monospace;
  font-size: clamp(0.85rem, 1vw, 1rem);
}

.code-muted {
  color: #777b71;
}

.code-accent {
  color: var(--accent);
}

.code-line {
  padding-left: 26px;
}

.profile-code strong {
  color: var(--text);
  font-weight: 500;
}

.profile-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.profile-metrics div {
  padding: 14px 10px;
  border: 1px solid var(--line);
}

.profile-metrics strong,
.profile-metrics span {
  display: block;
}

.profile-metrics strong {
  margin-bottom: 3px;
  font-size: 0.83rem;
}

.profile-metrics span {
  color: var(--muted);
  font-size: 0.68rem;
  line-height: 1.4;
}


@keyframes rotate{to{transform:rotate(360deg)}}.stage.vertical{width:min(100%,390px);aspect-ratio:9/16;flex:none;min-height:0}.stage.vertical .scene{min-height:0}.stage.vertical .hero-visual{min-height:100%;transform:scale(.78)}.stage.vertical .orbit-one{width:390px;height:390px}.stage.vertical .orbit-two{width:290px;height:290px}.stage.vertical .profile-card{width:390px;max-width:calc(100% - 4px)}.stage.vertical .profile-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.stage.vertical .profile-metrics div{padding:10px 6px}.stage.vertical .profile-metrics span{font-size:10px}.stage.vertical .profile-code{font-size:13px}.stage.vertical .code-line{padding-left:12px}.stage.vertical .hero-visual{width:480px;max-width:none}.stage.vertical .profile-card{max-width:390px}
@media(max-width:620px){.app{padding:10px;gap:12px}.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1;padding:10px 5px;font-size:12px}.stage{min-height:470px}.scene{min-height:470px}.hero-visual{min-height:450px}.orbit-one{width:min(92vw,390px);height:min(92vw,390px)}.orbit-two{width:260px;height:260px}.profile-card{width:min(calc(100% - 38px),370px);padding:10px 18px 18px}.profile-code{font-size:clamp(10px,2.8vw,14px);padding:125px 0}.code-line{padding-left:12px}.profile-metrics{gap:5px}.profile-metrics div{padding:8px 5px}.profile-metrics strong{font-size:11px}.profile-metrics span{font-size:9px}.profile-top{font-size:11px}.stage.vertical{width:min(100%,390px)}.stage.vertical .hero-visual{transform:scale(.7)}}
@media(max-width:370px){.stage.vertical .hero-visual{transform:scale(.62)}.orbit-one{width:min(92vw,340px);height:min(92vw,340px)}.orbit-two{width:245px;height:245px}}
body.recording{background:var(--background)}body.recording .toolbar,body.recording .hint{display:none}body.recording .app{padding:0;gap:0}body.recording .stage{width:100vw;height:100dvh;min-height:0;box-shadow:none}body.recording .scene{min-height:0}body.recording .hero-visual{min-height:100%}body.recording .stage.vertical{width:min(100vw,56.25dvh);height:100dvh;aspect-ratio:9/16}body.recording .stage.vertical .hero-visual{transform:scale(.78)}

/* Fullscreen and browser fallback: fixed viewport works on mobile browsers too. */
body.recording{overflow:hidden}
body.recording .app{position:fixed;inset:0;min-height:0;z-index:1000}
body.recording .stage{flex:1}
body.recording .stage.vertical{flex:none;margin:auto}
.exit-recording{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:1100;display:none;border:1px solid #cbd5df;background:#fff;color:#18202b;padding:10px 14px;border-radius:8px;font:600 13px system-ui;cursor:pointer;opacity:.75}
body.recording .exit-recording{display:block}
@media(max-width:620px){body.recording .stage.vertical .hero-visual{transform:scale(.70)}}


/* Smaller card with visible orbit all around */
.profile-card{width:min(calc(100% - 32px),340px);padding:12px 20px 20px}
.profile-code{padding:76px 0;font-size:12px}
.profile-metrics div{padding:10px 6px}
.profile-metrics span{font-size:10px}
.stage.vertical .profile-card{width:310px;max-width:310px}
.stage.vertical .profile-code{padding:70px 0}
@media(max-width:620px){.profile-card{width:min(calc(100% - 58px),300px);padding:10px 14px 16px}.profile-code{padding:66px 0;font-size:11px}.stage.vertical .profile-card{width:310px;max-width:310px}.stage.vertical .profile-code{padding:70px 0}}

/* Developer code block: compact, readable, sequential entrance */
.profile-code { gap: 3px; padding: 42px 0; font-size: clamp(10px, 1.1vw, 12px); line-height: 1.55; white-space: nowrap; }
.profile-code .source-line { display:block; animation: codeAppear .35s both; }
.profile-code .source-line.indent { padding-left: 13px; }
.profile-code .source-line.indent2 { padding-left: 25px; }
.profile-code .source-line:nth-child(1){animation-delay:.8s}
.profile-code .source-line:nth-child(2){animation-delay:1.05s}
.profile-code .source-line:nth-child(3){animation-delay:1.3s}
.profile-code .source-line:nth-child(4){animation-delay:1.55s}
.profile-code .source-line:nth-child(5){animation-delay:1.8s}
.profile-code .source-line:nth-child(6){animation-delay:2.05s}
.profile-code .source-line:nth-child(7){animation-delay:2.3s}
.profile-code .source-line:nth-child(8){animation-delay:2.55s}
.profile-code .source-line:nth-child(9){animation-delay:2.8s}
.profile-code .source-line:nth-child(10){animation-delay:3.05s}
.profile-code .source-line:nth-child(11){animation-delay:3.3s}
.profile-code .source-line:nth-child(12){animation-delay:3.55s}
.profile-code .code-string { color:#80B890; }
.profile-code .code-accent { color:#0F75BC; }
.profile-code .code-method { color:#D5A85D; }
.build-line { margin-top:12px; animation:codeAppear .5s 4.1s both; }
.build-success { color:#56B879; margin-top:14px; font-size:clamp(17px, 2.5vw, 22px); font-weight:700; letter-spacing:.025em; line-height:1.35; animation:codeAppear .5s 5s both; }
.stage.vertical .build-success { font-size:19px; }
.caret { display:inline-block; width:5px; height:1em; margin-left:3px; vertical-align:-2px; background:#0F75BC; animation:blink 1s step-end infinite; }
@keyframes blink {50%{opacity:0}}
@keyframes codeAppear {from{opacity:0; transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.stage.vertical .profile-code { padding:38px 0; font-size:11px; }
